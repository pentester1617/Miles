{% extends "auth_shell.html" %}{% block title %}Log in · MILES{% endblock %}{% block auth %}
<div class="eyebrow">Welcome back</div><h1>Log in to MILES</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username<input name="username" autocomplete="username" required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button class="btn primary full">Log in</button></form>
<p class="center muted">New to MILES? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
{% endblock %}
