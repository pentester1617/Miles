{% extends "base.html" %}{% block title %}Alerts · MILES{% endblock %}{% block content %}<div class="section-head"><div><div class="eyebrow">Updates</div><h1>Notifications</h1></div></div><div class="inbox">{% for n in notifications %}<a class="inbox-item" href="{{ n.link }}"><div class="dot {{ 'unread' if not n.is_read else '' }}"></div><div><strong>{{ n.text }}</strong><p>{{ n.created_at.strftime('%d %b %Y, %H:%M') }}</p></div></a>{% else %}<div class="empty">No notifications yet.</div>{% endfor %}</div>{% endblock %}
